    from: apertura
    to: precio-optimo
    minutes: 5
  - label: 'Volver a la parábola: qué hacen a y c'
    from: repaso-parabola
    to: repaso-a-c-ingreso
    minutes: 15
  - label: 'Ceros por factorización'
    from: ceros-definicion
    to: ceros-trinomio
    minutes: 9
  - label: 'Fórmula general y discriminante'
    from: formula-general
    to: discriminante-practica
    minutes: 15
  - label: 'Simetría y vértice'
    from: vertice
    to: vertice-formula
    minutes: 13
  - label: 'Esbozar la parábola y cerrar el contexto'
    from: esbozo-ingreso
    to: respuesta-ingreso
    minutes: 12
  - label: 'Ticket tipo PAES'
    from: ticket-paes
    to: ticket-paes-maximo
    minutes: 8
  - label: 'Cierre'
    from: cierre
    to: cierre
    minutes: 3
