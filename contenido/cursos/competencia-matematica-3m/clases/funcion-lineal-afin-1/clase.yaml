    from: pendiente
    to: signo-pendiente
    minutes: 10
  - label: Interpretar m y n en contexto
    from: interpretar
    to: interpretar
    minutes: 5
  - label: 'Desafío: gráficos, intersección, sistema e intervalos'
    from: planes-graficos
    to: planes-intervalos
    minutes: 19
  - label: 'Ticket tipo PAES: resolver, contrastar y corregir'
    from: ticket-paes
    to: ticket-paes
    minutes: 10
  - label: Cierre y anticipo de la parte 2
    from: cierre
    to: cierre
    minutes: 4
