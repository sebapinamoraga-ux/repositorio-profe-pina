# Biblioteca docente: unidades, orden y fechas de sus clases. Se edita desde la app (Clases).
# El título es público: usa un nombre genérico, sin datos privados de cursos.
title: 'PAES Ciencias: Física'
calendario: publicacion
units:
  - id: fis-ondas
    title: Ondas
    lessons:
      - id: fis-elementos-onda
        title: Elementos de una onda
        objective: Relacionar longitud de onda, frecuencia, período, amplitud y rapidez de propagación.
        date: 2027-03-04
      - id: fis-espectro-electromagnetico
        title: El espectro electromagnético
        objective: Ordenar el espectro según longitud de onda y frecuencia y reconocer sus usos.
        date: 2027-03-11
      - id: fis-reflexion-refraccion
        title: Absorción, reflexión y refracción
        objective: Explicar la absorción, reflexión y refracción y la propagación rectilínea de la luz.
        date: 2027-03-18
      - id: fis-doppler-interferencia
        title: Doppler, interferencia y difracción
        objective: Describir cualitativamente el efecto Doppler, la interferencia y la difracción.
        date: 2027-03-25
      - id: fis-colores-dispersion
        title: Colores y dispersión
        objective: Explicar la formación de colores y la dispersión de la luz.
        date: 2027-04-01
      - id: fis-espejos
        title: Espejos
        objective: Predecir imágenes en espejos planos, cóncavos y convexos.
        date: 2027-04-08
      - id: fis-lentes
        title: Lentes
        objective: Predecir imágenes en lentes convergentes y divergentes.
        date: 2027-04-15
      - id: fis-dispositivos-ondas
        title: Ondas en la tecnología
        objective: Explicar el funcionamiento de radar, fibra óptica, telescopios y otros dispositivos.
        date: 2027-04-22
      - id: fis-practica-ondas
        title: 'Práctica: Ondas'
        objective: Resolver de forma autónoma preguntas tipo PAES de ondas, con pausas para intentar y comprobar.
        date: 2027-04-29
  - id: fis-mecanica
    title: Mecánica
    lessons:
      - id: fis-describir-movimiento
        title: Describir un movimiento
        objective: Usar sistema de referencia, posición, desplazamiento, rapidez y velocidad.
        date: 2027-05-06
      - id: fis-relatividad-galileo
        title: Relatividad de Galileo
        objective: Componer velocidades en movimientos rectilíneos uniformes.
        date: 2027-05-13
      - id: fis-mru
        title: Movimiento rectilíneo uniforme
        objective: Usar la ecuación de itinerario y los gráficos del MRU.
        date: 2027-05-20
      - id: fis-mrua
        title: Movimiento uniformemente acelerado
        objective: Usar la ecuación de itinerario y los gráficos del MRUA.
        date: 2027-05-27
      - id: fis-practica-cinematica
        title: 'Práctica: Cinemática'
        objective: Resolver de forma autónoma preguntas tipo PAES de cinemática, con pausas para intentar y comprobar.
        date: 2027-06-03
      - id: fis-leyes-newton
        title: Leyes de Newton
        objective: Aplicar las leyes de Newton con diagramas de cuerpo libre.
        date: 2027-06-10
      - id: fis-fuerzas
        title: Peso, normal, tensión y ley de Hooke
        objective: Identificar y calcular las fuerzas más comunes.
        date: 2027-06-17
      - id: fis-roce
        title: Fuerza de roce
        objective: Distinguir el roce estático del cinético y describir el roce con el aire.
        date: 2027-06-24
      - id: fis-practica-dinamica
        title: 'Práctica: Dinámica'
        objective: Resolver de forma autónoma preguntas tipo PAES de dinámica, con pausas para intentar y comprobar.
        date: 2027-07-01
      - id: fis-modelos-sistema-solar
        title: Del geocentrismo a Kepler
        objective: Comparar los modelos geocéntrico y heliocéntrico y los aportes de Galileo y Kepler.
        date: 2027-07-08
      - id: fis-origen-universo
        title: Origen y evolución del universo
        objective: Describir las teorías sobre el origen del universo y sus evidencias.
        date: 2027-07-15
      - id: fis-practica-universo
        title: 'Práctica: Universo'
        objective: Resolver de forma autónoma preguntas tipo PAES de universo, con pausas para intentar y comprobar.
        date: 2027-07-22
  - id: fis-electricidad
    title: Electricidad
    lessons:
      - id: fis-corriente-electrica
        title: Corriente eléctrica
        objective: Explicar la corriente como flujo de cargas en circuitos de corriente continua.
        date: 2027-07-29
      - id: fis-ley-ohm
        title: Ley de Ohm
        objective: Relacionar voltaje, corriente y resistencia.
        date: 2027-08-05
      - id: fis-circuitos
        title: Circuitos en serie, paralelo y mixtos
        objective: Resolver circuitos con resistores en serie, paralelo y mixtos.
        date: 2027-08-12
      - id: fis-potencia-electrica
        title: Potencia y energía eléctrica
        objective: Calcular potencia y energía en circuitos de corriente continua.
        date: 2027-08-19
      - id: fis-consumo-eficiencia
        title: Consumo y eficiencia energética
        objective: Comparar el consumo y la eficiencia de artefactos eléctricos.
        date: 2027-08-26
      - id: fis-instalacion-domiciliaria
        title: La instalación eléctrica de la casa
        objective: Reconocer los componentes de la instalación domiciliaria y sus funciones.
        date: 2027-09-02
      - id: fis-practica-electricidad
        title: 'Práctica: Electricidad'
        objective: Resolver de forma autónoma preguntas tipo PAES de electricidad, con pausas para intentar y comprobar.
        date: 2027-09-09
  - id: fis-energia-tierra
    title: Energía y Tierra
    lessons:
      - id: fis-deriva-continental
        title: Deriva continental
        objective: Explicar la deriva continental, sus evidencias y su relación con la tectónica de placas.
        date: 2027-09-16
      - id: fis-tectonica-placas
        title: Tectónica de placas
        objective: Relacionar la tectónica de placas con sismos, volcanismo y relieve.
        date: 2027-09-23
      - id: fis-interior-tierra
        title: El interior de la Tierra
        objective: Relacionar el modelo físico de la geosfera con la tectónica de placas.
        date: 2027-09-30
      - id: fis-practica-tierra
        title: 'Práctica: Energía y Tierra'
        objective: Resolver de forma autónoma preguntas tipo PAES de energía y tierra, con pausas para intentar y comprobar.
        date: 2027-10-07
  - id: fis-habilidades-cientificas
    title: Habilidades científicas
    lessons:
      - id: fis-investigacion
        title: Preguntas, hipótesis y variables
        objective: Plantear preguntas e hipótesis y planificar una investigación controlando variables.
        date: 2027-10-14
      - id: fis-analizar-evidencia
        title: Analizar evidencia experimental
        objective: Procesar, analizar y evaluar datos experimentales en tablas y gráficos.
        date: 2027-10-21
      - id: fis-practica-habilidades
        title: 'Práctica: Habilidades científicas'
        objective: Resolver de forma autónoma preguntas tipo PAES de habilidades científicas, con pausas para intentar y comprobar.
        date: 2027-10-28
