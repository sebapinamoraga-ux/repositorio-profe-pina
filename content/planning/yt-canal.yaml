# Biblioteca docente: unidades, orden y fechas de sus clases. Se edita desde la app (Clases).
# El título es público: usa un nombre genérico, sin datos privados de cursos.
title: 'Canal: estrategia y temporada'
calendario: publicacion
units:
  - id: canal-estrategia
    title: Estrategia de prueba
    lessons:
      - id: canal-como-es-la-paes
        title: Cómo es la PAES
        objective: Conocer la estructura de M1, M2 y Ciencias y qué evalúa cada prueba.
        date: 2027-03-01
      - id: canal-por-donde-empiezo
        title: ¿Por dónde empiezo? Diagnóstico y rutas
        objective: Diagnosticar el propio nivel y elegir una ruta de videos.
        date: 2027-03-03
      - id: canal-calculo-sin-calculadora
        title: Cálculo sin calculadora
        objective: Agilizar fracciones, porcentajes y potencias sin calculadora.
        date: 2027-03-10
      - id: canal-gestion-tiempo
        title: Gestionar el tiempo en la prueba
        objective: Distribuir el tiempo y decidir cuándo dejar una pregunta para después.
        date: 2027-05-05
      - id: canal-descartar-alternativas
        title: Descartar alternativas
        objective: Usar estimación y comprobación para descartar alternativas.
        date: 2027-08-04
      - id: canal-suficiencia-datos
        title: Preguntas de suficiencia de datos
        objective: Resolver preguntas de suficiencia de datos de M2.
        date: 2027-08-18
  - id: canal-ensayos
    title: Ensayos y pruebas liberadas
    lessons:
      - id: canal-ensayo-invierno-m1-2027
        title: Ensayo en vivo M1 (invierno 2027)
        objective: Resolver un ensayo M1 completo en tiempo real antes de la PAES de invierno.
        date: 2027-06-05
      - id: canal-ensayo-m1-2027
        title: Ensayo en vivo M1 (2027)
        objective: Resolver un ensayo M1 completo en tiempo real.
        date: 2027-10-09
      - id: canal-ensayo-fisica-2027
        title: Ensayo en vivo Ciencias–Física (2027)
        objective: Resolver un ensayo de Física en tiempo real.
        date: 2027-10-23
      - id: canal-ensayo-m2-2027
        title: Ensayo en vivo M2 (2027)
        objective: Resolver un ensayo M2 completo en tiempo real.
        date: 2027-11-06
  - id: canal-temporada
    title: 'Temporada: calendario, puntajes y postulación'
    lessons:
      - id: canal-ultima-semana-2026
        title: La última semana antes de la PAES (2026)
        objective: Organizar el repaso y la logística de la última semana.
        date: 2026-11-20
      - id: canal-puntajes-2027
        title: Cómo leer tu puntaje y las ponderaciones (2027)
        objective: Interpretar puntajes, percentiles y ponderaciones por carrera.
        date: 2027-01-06
      - id: canal-postulacion-2027
        title: Postular paso a paso (2027)
        objective: Conocer las etapas y plazos de la postulación.
        date: 2027-01-08
      - id: canal-plan-egresados-2027
        title: Plan de estudio para egresados (2027)
        objective: Armar un plan semanal de estudio autónomo para el año.
        date: 2027-02-24
      - id: canal-inscripcion-2027
        title: Inscripción a la PAES (2027)
        objective: Conocer plazos y pasos de la inscripción a la PAES regular.
        date: 2027-06-16
      - id: canal-ultima-semana-2027
        title: La última semana antes de la PAES (2027)
        objective: Organizar el repaso y la logística de la última semana.
        date: 2027-11-24
  - id: canal-puente-u
    title: Puente a la universidad
    lessons:
      - id: canal-puente-precalculo
        title: Precálculo para primer año
        objective: Repasar funciones y álgebra que se usan en el primer año universitario.
        date: 2027-02-10
      - id: canal-puente-fisica
        title: Física para primer año
        objective: Repasar cinemática y vectores que se usan en el primer año universitario.
        date: 2027-02-17
