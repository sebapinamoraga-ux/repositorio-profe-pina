prompt: '¿Cuál de estos números es divisible por 3 y por 5?'
answer: D · 135
solution: '135 termina en 5, así que es divisible por 5, y 1 + 3 + 5 = 9 es múltiplo de 3. Comprobación: 135 = 15 · 9.'
