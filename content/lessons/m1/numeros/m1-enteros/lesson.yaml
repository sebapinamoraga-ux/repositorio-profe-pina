id: m1-enteros
title: 'Números enteros: operaciones y orden'
subject: m1
axis: Números
duration: 12
prerequisites:
  - Números naturales y cardinales, y la clausura de sus operaciones.
  - Prioridad de las operaciones (PaPoMuDAS).
objectives:
  - Operar y ordenar números enteros con seguridad en los signos.
  - Reconocer el conjunto de los enteros, sus subconjuntos y el inverso aditivo.
  - Comparar enteros y calcular su valor absoluto, distinguiendo orden de distancia al cero.
  - Representar sumas y restas de enteros como desplazamientos en la recta numérica.
  - Justificar la regla de los signos con el opuesto del opuesto y evitar el error −2² = 4.
skills: [Representar, Argumentar, Resolver problemas]
curriculum: [m1-2027-enteros-racionales]
status: draft
tramos:
  - label: 'Gancho: el termómetro que baja 8 grados'
    from: apertura
    to: termometro
    minutes: 1
  - label: 'Teoría: conjunto, inverso aditivo, orden y valor absoluto'
    from: conjunto-enteros
    to: pausa-orden
    minutes: 3.5
  - label: 'Adición y sustracción: reglas y movimiento en la recta'
    from: adicion-enteros
    to: mismo-movimiento
    minutes: 2.5
  - label: 'Multiplicación, división y clausura en ℤ'
    from: multiplicar-negativo
    to: clausura-enteros
    minutes: 2
  - label: 'Error con nombre: el menos que se pierde'
    from: menos-que-se-pierde
    to: menos-que-se-pierde
    minutes: 1
  - label: 'Utilidad PAES: contexto y paso con error'
    from: enteros-en-contexto
    to: paso-con-error
    minutes: 1.5
  - label: 'Cierre: vuelve al termómetro'
    from: vuelta-termometro
    to: cierre
    minutes: 0.5
slides:
