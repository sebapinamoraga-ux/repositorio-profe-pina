prerequisites:
  - Multiplicar y dividir números naturales.
  - Descomponer un natural en factores primos.
objectives:
  - Calcular el MCM y el mcd de varios naturales con su descomposición en factores primos.
  - Decidir si un problema pide coincidir (MCM) o repartir sin que sobre (mcd).
